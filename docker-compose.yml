# docker-compose.yml
# 
# compose file for configuring the postgres db inside of a container.
# since it is a local container, the user and password are exposed,
# so use these to login to the local db
#
# to build and start containers:
#   docker compose up --build -d
# 
# to remove volume (delete all db data)
#   docker compose down --volumes

# name of the compose stack
name: express-server-assignment

services:
  db:
    image: postgres:18
    container_name: express-server-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: express-server-assignment
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d express-server-assignment"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: